name: Atividade 4 - DevOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validar-infraestrutura:
    name: Validar CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::853815796153:role/GitHubActions-Unyleya-DeployRole
          aws-region: sa-east-1
          role-session-name: UnyleyaAtividade4

      - name: Confirmar identidade AWS
        run: aws sts get-caller-identity

      - name: Validar template CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://template.yaml \
            --region sa-east-1

      - name: Confirmar validacao
        run: |
          echo "Autenticacao OIDC realizada."
          echo "Template CloudFormation validado."

      - name: Deploy CloudFormation
        if: github.event_name == 'workflow_dispatch'
        env:
          ACCESS_CIDR: ${{ vars.ACCESS_CIDR }}
        run: |
          test -n "$ACCESS_CIDR" || {
            echo "ERRO: Variavel ACCESS_CIDR nao configurada."
            exit 1
          }

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name unyleya-lab4 \
            --region sa-east-1 \
            --role-arn arn:aws:iam::853815796153:role/DevOps-Unyleya-CloudFormationRole \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AccessCidr="$ACCESS_CIDR" \
              AvailabilityZoneA=sa-east-1a \
              AvailabilityZoneB=sa-east-1b \
            --no-fail-on-empty-changeset

      - name: Confirmar resultado do deploy
        if: github.event_name == 'workflow_dispatch'
        run: |
          aws cloudformation describe-stacks \
            --stack-name unyleya-lab4 \
            --region sa-east-1 \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table
